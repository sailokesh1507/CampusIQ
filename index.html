<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6fb" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved appearance before first paint to avoid a light-mode flash.
      (function () {
        var theme;
        try { theme = localStorage.getItem('campusiq-theme'); } catch (_) {}
        if (theme !== 'dark' && theme !== 'light') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0c0e17' : '#f5f6fb';
      })();
    </script>
    <title>CampusIQ · Student Success Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
